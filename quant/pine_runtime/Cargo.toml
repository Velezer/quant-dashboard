[package]
name = "quant_pine_runtime"
version = "0.1.0"
edition = "2021"
description = "Bounded Pine Script indicator and strategy runtimes"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quant_core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
