name: Rust build

on:
  pull_request:
    paths:
      - "backend/**"
      - "quant/**"
      - "frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/rust-build.yml"
      - ".github/scripts/**"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "quant/**"
      - "frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/rust-build.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      BUILD_METRICS_DIR: /tmp/quant-build-metrics
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Prepare build resource evidence
        run: mkdir -p "$BUILD_METRICS_DIR"
      - name: Build Pine runtime WASM
        run: |
          /usr/bin/time -v -o "$BUILD_METRICS_DIR/wasm-time.txt" \
            cargo build --locked --release --target wasm32-unknown-unknown -p quant_pine_runtime
      - name: Build service
        run: |
          /usr/bin/time -v -o "$BUILD_METRICS_DIR/service-time.txt" \
            cargo build --locked --release -p rust_chart_api
      - name: Verify gainer research causality and persistence
        run: |
          cargo test --locked --release -p quant_core sampled_entry_tests
          cargo test --locked --release -p quant_core tokocrypto_published_quote_policy
          cargo test --locked --release -p rust_chart_api gainer_tests -- --test-threads=1
          cargo test --locked --release -p rust_chart_api native_backfill_ -- --test-threads=1
      - name: Verify signed indicator cancellation
        run: |
          cargo test --locked --release -p quant_core signed_score_tests
          cargo test --locked --release -p quant_core directional_holdout_partitions
      - name: Verify Stockbit score references
        run: |
          cargo test --locked --release -p rust_chart_api stockbit_4h_scores_without_a_15m_price -- --test-threads=1
          cargo test --locked --release -p rust_chart_api list_signal_screener_withholds_stale_stockbit_score_rows -- --test-threads=1
      - name: Verify Pintu product exclusions
        run: |
          cargo test --locked --release -p rust_chart_api pintu_listing::tests -- --test-threads=1
          cargo test --locked --release -p rust_chart_api pintu_announced_delistings_apply_even_during_feed_failure -- --test-threads=1
      - name: Verify shared crypto history backfill ownership
        run: |
          cargo test --locked --release -p rust_chart_api --bin rust_chart_api \
            only_the_selected_shared_history_owner_advances_incomplete_fresh_history -- \
            --test-threads=1
      - name: Verify after-fee summaries and history-arrival rechecks
        run: |
          cargo test --locked --release -p rust_chart_api --bin rust_chart_api \
            first_ingested_candles_refresh_a_saved_no_history_report_and_clear_its_queue_item -- \
            --test-threads=1
          cargo test --locked --release -p rust_chart_api --bin rust_chart_api \
            market_ingestion_queues_only_empty_reports_for_the_matching_shared_crypto_category -- \
            --test-threads=1
          cargo test --locked --release -p rust_chart_api --bin rust_chart_api \
            mature_history_requeues_only_under_minimum_reports_for_ingested_timeframes_and_category -- \
            --test-threads=1
          cargo test --locked --release -p rust_chart_api --bin rust_chart_api \
            snapshots_upsert_only_the_exact_instrument_and_timeframe_and_preserve_aggregate_evidence -- \
            --test-threads=1
      - name: Verify screener filter and response contracts
        run: |
          cargo test --locked --release -p rust_chart_api --bin rust_chart_api signal_screener_route_accepts_all_six_visible_indicator_filters -- --test-threads=1
          cargo test --locked --release -p rust_chart_api --bin rust_chart_api filter_tests -- --test-threads=1
          node --test \
            frontend/dashboard/scripts/modules/screener-response-contract.test.mjs \
            frontend/dashboard/scripts/modules/signal-screener-freshness-contract.test.mjs \
            frontend/dashboard/scripts/modules/signal-refresh.test.mjs \
            frontend/dashboard/scripts/modules/signal-refresh-countdown.test.mjs
      - name: Run SQLite journal regressions
        run: |
          set -o pipefail
          /usr/bin/time -v -o "$BUILD_METRICS_DIR/journal-tests-time.txt" \
            cargo test --locked --release -p rust_chart_api --bin rust_chart_api \
              database::connections::journal::tests -- --test-threads=1 \
            2>&1 | tee "$BUILD_METRICS_DIR/journal-tests.log"
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$BUILD_METRICS_DIR/journal-tests.log"
      - name: Run SQLite write isolation regressions
        run: |
          set -o pipefail
          for module in research_proxy::persistence_tests \
            tokocrypto_storage::registry_tests tokocrypto_storage::tests \
            pintu_storage::persistence_tests \
            signal_alerts::screener::snapshot::transaction_tests; do
            label="${module//::/-}"
            cargo test --locked --release -p rust_chart_api --bin rust_chart_api \
              "$module" -- --test-threads=1 \
              2>&1 | tee "$BUILD_METRICS_DIR/$label.log"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$BUILD_METRICS_DIR/$label.log"
          done
      - name: Build production Docker image
        run: |
          set -o pipefail
          docker build --progress=plain --tag quant-dashboard:startup-smoke . \
            2>&1 | tee "$BUILD_METRICS_DIR/docker-build.log"
      - name: Check image startup and restart within 32 MiB
        run: python3 .github/scripts/container_smoke.py
      - name: Summarize build and startup evidence
        if: always()
        run: python3 .github/scripts/build_metrics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-resource-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/quant-build-metrics
          retention-days: 7
