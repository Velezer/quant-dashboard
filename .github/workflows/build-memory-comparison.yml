name: Build memory comparison

on:
  push:
    paths: [".github/workflows/build-memory-comparison.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Measure ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: thin-one-unit
            lto: thin
            units: 1
          - name: off-sixteen-units
            lto: "off"
            units: 16
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_RELEASE_LTO: ${{ matrix.lto }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.units }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Measure clean release builds
        run: |
          mkdir -p build-memory
          /usr/bin/time -f 'peak_rss_kib=%M\nelapsed_seconds=%e' -o build-memory/pine.txt cargo build --locked --release --target wasm32-unknown-unknown -p quant_pine_runtime
          /usr/bin/time -f 'peak_rss_kib=%M\nelapsed_seconds=%e' -o build-memory/service.txt cargo build --locked --release -p rust_chart_api
          stat -c '%n %s bytes' target/release/rust_chart_api target/wasm32-unknown-unknown/release/quant_pine_runtime.wasm > build-memory/artifacts.txt
          cat build-memory/*.txt
          cat build-memory/*.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-${{ matrix.name }}
          path: build-memory
