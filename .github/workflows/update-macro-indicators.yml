name: Refresh macro indicator snapshot

on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-macro-indicator-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and validate the FRED series
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 45 \
            'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFII10&cosd=2015-01-01' \
            --output "$RUNNER_TEMP/DFII10.csv"
          python3 .github/scripts/update_macro_indicators.py \
            --source "$RUNNER_TEMP/DFII10.csv" \
            --output macrodata/DFII10.csv
          python3 .github/scripts/update_macro_indicators.py \
            --validate macrodata/DFII10.csv
      - name: Publish the refreshed snapshot to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- macrodata/DFII10.csv
          if git diff --cached --quiet; then
            echo "The FRED snapshot is unchanged."
            exit 0
          fi
          git commit -m "Refresh FRED macro indicator snapshot"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
