name: Readiness diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/readiness-diagnostic.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09f5ea7136329ee46b0da01ebf4da36efdb52ba4
          persist-credentials: false
      - name: Rust versions
        run: rustc --version && cargo --version
      - name: Stockbit close and pause tests
        run: cargo test --locked -p rust_chart_api stockbit_close_tests
      - name: IDX intraday bucket tests
        run: cargo test --locked -p rust_chart_api intraday_bucket_tests
      - name: Crypto 4h rollup tests
        run: cargo test --locked -p rust_chart_api scan_timeframe_crypto_4h_tests
      - name: Parallel scan progress tests
        run: cargo test --locked -p rust_chart_api parallel_scan_progress_event_lists_both_active_tickers
      - name: Readiness tests
        run: cargo test --locked -p rust_chart_api signal_alerts::readiness::tests
      - name: Check service
        run: cargo check --locked -p rust_chart_api
