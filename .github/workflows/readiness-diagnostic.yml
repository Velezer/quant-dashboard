name: Chart overlay diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/readiness-diagnostic.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 833f6728fa00e5dca7466c8864b4efdab460f45c
          persist-credentials: false
      - name: Rust versions
        run: rustc --version && cargo --version
      - name: Chart pane clipping test
        run: node --test frontend/dashboard/scripts/modules/chart-renderer.test.mjs
      - name: Chart renderer syntax
        run: node --check frontend/dashboard/scripts/modules/chart-renderer.js
