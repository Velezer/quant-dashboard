[workspace]
members = [
    "quant/core",
    "quant/pine_runtime",
    "backend/service",
]
resolver = "2"

[profile.release]
opt-level = "s"       # Optimize for minimum binary size and RAM footprint
lto = "off"            # Avoid whole-program LLVM memory during managed builds
codegen-units = 16     # Optimize smaller modules instead of one large LLVM module
panic = "abort"        # Eliminates unwinding landing pads and EH frame tables
strip = true           # Strip all debug symbols and names from final binary
