[workspace]
members = [
    "quant/core",
    "quant/pine_runtime",
    "backend/service",
]
resolver = "2"

[profile.release]
opt-level = 1          # Reduce LLVM optimization work during managed builds
lto = "off"            # Avoid whole-program LLVM memory during managed builds
codegen-units = 64     # Bound per-module LLVM work during release compilation
panic = "abort"        # Eliminates unwinding landing pads and EH frame tables
strip = true           # Strip all debug symbols and names from final binary
